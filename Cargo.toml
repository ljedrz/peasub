[package]
name = "peasub"
version = "0.1.0"
edition = "2021"
license = "MIT OR CC0-1.0"
description = "A metadata-private gossip protocol built on peashape, with constant-rate or Poisson-distributed cover traffic."
repository = "https://github.com/ljedrz/peasub"
readme = "README.md"
keywords = ["p2p", "gossip", "privacy", "metadata", "cover-traffic"]
categories = ["network-programming"]

[dependencies]
peashape = "0.1"
pea2pea = "0.56"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = "1"
tracing = "0.1"
rand = "0.9"
parking_lot = "0.12"
thiserror = "2"
lru = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
chacha20poly1305 = "0.10"
