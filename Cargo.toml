[package]
name = "peasub"
version = "0.3.0"
authors = ["ljedrz <ljedrz@gmail.com>"]
edition = "2024"
description = "A metadata-private gossip protocol built on peashape, with constant-rate or Poisson-distributed cover traffic."
license = "CC0-1.0 OR MIT"
repository = "https://github.com/ljedrz/peasub"
homepage = "https://github.com/ljedrz/peasub"
documentation = "https://docs.rs/peasub"
readme = "README.md"
categories = ["network-programming"]
keywords = ["p2p", "gossip", "privacy", "metadata", "cover-traffic"]
rust-version = "1.88"

[dependencies]
peashape = "0.4"
pea2pea = "0.57"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
bytes = "1"
tracing = "0.1"
rand = "0.10"
parking_lot = "0.12"
thiserror = "2"
lru = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
chacha20poly1305 = "0.10"
